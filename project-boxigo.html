<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxigo — Social Media Design · Krexlab</title>
<meta name="description" content="Social media design system for Boxigo — a complete visual identity across Instagram, LinkedIn and digital campaigns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --mint:#4dd4a8;--bg:#07181f;--bg-soft:#0c2530;
  --ink:#f4f7f6;--muted:#8ba2ab;--border:rgba(255,255,255,.06);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Outfit',ui-sans-serif,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;cursor:none;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:96px 96px;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
::-webkit-scrollbar{width:0}

/* CURSOR */
.cursor-dot{position:fixed;top:0;left:0;width:8px;height:8px;background:var(--mint);border-radius:9999px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference}
.cursor-ring{position:fixed;top:0;left:0;width:36px;height:36px;border:1px solid rgba(77,212,168,.55);border-radius:9999px;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s cubic-bezier(.2,.8,.2,1),height .3s,border-color .3s,background .3s}
.cursor-ring.is-hover{width:72px;height:72px;background:rgba(77,212,168,.08);border-color:rgba(77,212,168,.8)}
@media(max-width:768px){.cursor-dot,.cursor-ring{display:none}body{cursor:auto}}

#particle-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:.4}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 20% 40%,rgba(77,212,168,.06) 0%,transparent 60%)}

/* HEADER */
header{position:fixed;top:0;inset-inline:0;z-index:50;padding:20px 5vw;display:flex;align-items:center;justify-content:space-between;transition:padding .5s,background .5s,border-color .5s,transform .55s;border-bottom:1px solid transparent}
header.scrolled{padding:12px 5vw;background:rgba(7,24,31,.7);backdrop-filter:blur(20px);border-color:rgba(255,255,255,.05)}
header.hide{transform:translateY(-100%)}
.nav-logo img{height:24px;width:auto}
.nav-links{display:flex;align-items:center;gap:2vw}
.nav-links a{font-size:.82rem;color:rgba(255,255,255,.7);text-decoration:none;transition:color .3s}
.nav-links a:hover{color:var(--mint)}
.nav-back{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:rgba(255,255,255,.5);text-decoration:none;transition:color .3s}
.nav-back:hover{color:var(--mint)}
.nav-back i{font-size:.7rem}
.nav-cta{padding:9px 20px;border-radius:9999px;background:var(--mint);color:#07181f!important;font-weight:500!important;transition:background .3s!important}
.nav-cta:hover{background:#fff!important}
.nav-mob-btn{display:none;width:40px;height:40px;border-radius:9999px;background:var(--mint);color:#07181f;align-items:center;justify-content:center;border:none;cursor:pointer;flex-direction:column;gap:3px}
.mob-line{display:block;width:16px;height:2px;background:#07181f}
@media(max-width:768px){.nav-links{display:none}.nav-mob-btn{display:flex}}

/* MOBILE MENU */
#mob-overlay{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .5s}
#mob-overlay.show{opacity:1;pointer-events:all}
#mob-menu{position:fixed;top:0;right:0;bottom:0;width:min(320px,85vw);z-index:60;background:#0a1e28;border-left:1px solid rgba(255,255,255,.07);transform:translateX(100%);transition:transform .6s cubic-bezier(.76,0,.24,1);display:flex;flex-direction:column;padding:28px 28px 32px}
#mob-menu.open{transform:translateX(0)}
.mob-close-btn{width:38px;height:38px;border-radius:9999px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:border-color .3s,color .3s;margin-left:auto}
.mob-close-btn:hover{border-color:var(--mint);color:var(--mint)}
.mob-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
.mob-logo img{height:20px;opacity:.7}
.mob-nav{display:flex;flex-direction:column;gap:4px;flex:1;justify-content:center}
.mob-nav a{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:300;letter-spacing:-.03em;color:rgba(255,255,255,.55);text-decoration:none;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;opacity:0;transform:translateX(24px);transition:color .3s}
.mob-nav a:last-child{border-bottom:none}
.mob-nav a:hover{color:var(--mint)}
.mob-nav a .arr{font-size:.9rem;color:rgba(255,255,255,.2)}
.mob-nav a:hover .arr{color:var(--mint)}
.mob-nav a.mob-cta{color:var(--mint);font-family:'Instrument Serif',serif;font-style:italic}
.mob-bottom{display:flex;flex-direction:column;gap:18px}
.mob-soc-label{font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.25)}
.mob-socials{display:flex;gap:10px}
.mob-soc-btn{width:36px;height:36px;border-radius:9999px;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);text-decoration:none;font-size:.85rem;transition:border-color .3s,color .3s}
.mob-soc-btn:hover{border-color:var(--mint);color:var(--mint)}
.mob-foot{display:flex;justify-content:space-between;font-size:.7rem;color:rgba(255,255,255,.25);padding-top:14px;border-top:1px solid rgba(255,255,255,.05)}
.mob-foot a{color:rgba(255,255,255,.25);text-decoration:none}

/* UTILS */
.page{position:relative;z-index:2}
.chip{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem .9rem;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,247,246,.75);border:1px solid rgba(255,255,255,.08);border-radius:9999px;background:rgba(255,255,255,.02);backdrop-filter:blur(6px)}
.chip-dot{width:6px;height:6px;border-radius:9999px;background:var(--mint);box-shadow:0 0 12px var(--mint);flex-shrink:0}
.serif-italic{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--mint)}
.text-stroke{-webkit-text-stroke:1px rgba(244,247,246,.35);color:transparent}
.reveal-mask{display:inline-block;overflow:hidden;vertical-align:bottom}
.reveal-mask>span{display:inline-block;transform:translateY(110%)}
.btn-mint{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:9999px;background:var(--mint);color:#07181f;font-weight:500;font-size:.85rem;text-decoration:none;transition:background .35s,transform .3s}
.btn-mint:hover{background:#fff;transform:translateY(-2px)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:9999px;border:1px solid rgba(255,255,255,.15);color:#fff;font-size:.85rem;text-decoration:none;transition:border-color .3s,color .3s}
.btn-ghost:hover{border-color:var(--mint);color:var(--mint)}
@keyframes pulse-ring{0%{transform:scale(.8);opacity:.8}80%,100%{transform:scale(2.2);opacity:0}}



function updateClock(){const el=document.getElementById('ft-clock');if(el)el.textContent=new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}
setInterval(updateClock,1000);updateClock();
</script>
</body>
</html>
